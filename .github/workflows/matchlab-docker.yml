name: MatchLab Docker image

on:
  push:
    branches:
      - main
      - feat/matchlab-native-mapping
    paths-ignore:
      - 'docs/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: matchlab-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Verify and build amd64 + arm64
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Check Go formatting
        shell: bash
        run: |
          files="$(gofmt -l ./internal/matchlab ./internal/torrent_info/db.go ./internal/torrent_stream/db.go ./internal/worker/map_matchlab_torrent.go ./internal/worker/map_matchlab_torrent_test.go ./internal/worker/torrent_parser.go ./internal/worker/map_imdb_torrent.go ./internal/worker/worker.go ./internal/config)"
          if [ -n "$files" ]; then
            echo "Unformatted Go files:"
            echo "$files"
            exit 1
          fi

      - name: Go tests
        env:
          STREMTHRU_ENV: test
        run: go test -tags 'sqlite_fts5,sqlite_stat4' ./internal/matchlab ./internal/torrent_info ./internal/torrent_stream ./internal/worker

      - name: Go vet
        run: go vet -tags 'sqlite_fts5,sqlite_stat4' ./internal/matchlab ./internal/torrent_info ./internal/torrent_stream ./internal/worker

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false
          package_json_file: package.json

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm

      - name: Build dashboard
        run: |
          pnpm install --frozen-lockfile
          pnpm run dash:build

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image tags
        id: tags
        env:
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          short_sha="${GITHUB_SHA:0:12}"
          image="ghcr.io/dizzybog/stremthru-matchlab"
          if [ "$GITHUB_REF_NAME" = "main" ]; then
            {
              echo "tags<<EOF"
              echo "$image:latest"
              echo "$image:sha-$short_sha"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          else
            {
              echo "tags<<EOF"
              echo "$image:pr-1"
              echo "$image:sha-$short_sha"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Build and publish multi-architecture image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/Dizzybog/stremthru-MatchLab
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.description=StremThru with MatchLab integration
          cache-from: type=gha,scope=stremthru-matchlab
          cache-to: type=gha,scope=stremthru-matchlab,mode=max
